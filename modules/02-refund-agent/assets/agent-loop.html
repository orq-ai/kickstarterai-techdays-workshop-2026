ass="tag">AGENT</text><text x="464.0" y="335" text-anchor="middle" class="name">Managed agent</text><text x="464.0" y="358" text-anchor="middle" class="sub">instructions · limits</text><rect x="664" y="282" width="240" height="96" rx="6" fill="#f9f8f6"/><rect x="664" y="282" width="240" height="96" rx="6" class="node"/><rect x="676" y="294" width="40" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/><text x="696" y="304" text-anchor="middle" class="tag">MODEL</text><text x="784.0" y="335" text-anchor="middle" class="name">Model</text><text x="784.0" y="358" text-anchor="middle" class="sub">answer or tool call</text><rect x="984" y="282" width="200" height="96" rx="6" fill="#f9f8f6"/><rect x="984" y="282" width="200" height="96" rx="6" class="focal"/><rect x="996" y="294" width="40" height="14" rx="2" fill="none" stroke="#df5325" stroke-opacity=".55"/><text x="1016" y="304" text-anchor="middle" class="tag">TOOL</text><text x="1084.0" y="335" text-anchor="middle" class="name">Code tool</text><text x="1084.0" y="358" text-anchor="middle" class="sub">sandbox result</text><text x="640" y="552" text-anchor="middle" class="callout">The loop ends on an answer, 8 iterations, or 120 seconds.</text><line x1="64" y1="632" x2="1216" y2="632" stroke="rgba(37,35,46,.18)"/><text x="64" y="672" class="legend">LEGEND</text><line x1="184" y1="668" x2="218" y2="668" class="link-arrow"/><text x="232" y="672" class="legend">request</text><line x1="372" y1="668" x2="406" y2="668" class="accent-arrow"/><text x="420" y="672" class="legend">tool execution</text><line x1="610" y1="668" x2="644" y2="668" class="return"/><text x="658" y="672" class="legend">context return</text></svg></div></body></html>
