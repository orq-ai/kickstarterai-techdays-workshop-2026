<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Refund logic system</title>
  <style>
    body { margin: 0; background: #f9f8f6; }
    .diagram-container { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; background: #f9f8f6; }
    .title { font: 600 44px Avio, system-ui, sans-serif; fill: #25232e; }
    .eyebrow { font: 500 11px Mono, monospace; letter-spacing: 1.3px; fill: #025558; }
    .name { font: 600 20px Avio, system-ui, sans-serif; fill: #25232e; }
    .sub { font: 14px Mono, monospace; fill: #6b6975; }
    .tag { font: 500 11px Mono, monospace; letter-spacing: .6px; fill: #6b6975; }
    .legend { font: 500 11px Mono, monospace; letter-spacing: .8px; fill: #6b6975; }
    .callout { font: italic 20px Avio, system-ui, sans-serif; fill: #25232e; }
    .node { fill: #f9f8f6; stroke: #25232e; stroke-width: 1.2; }
    .focal { fill: rgba(223, 83, 37, .08); stroke: #df5325; stroke-width: 1.4; }
    .zone { fill: rgba(37, 35, 46, .02); stroke: rgba(37, 35, 46, .22); stroke-width: 1; }
    .arrow { fill: none; stroke: #025558; stroke-width: 1.4; marker-end: url(#arrow); }
    .accent-arrow { fill: none; stroke: #df5325; stroke-width: 1.6; marker-end: url(#arrow-accent); }
    .return { fill: none; stroke: #6b6975; stroke-width: 1.1; stroke-dasharray: 5,4; marker-end: url(#arrow); }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="refund-logic-system-title refund-logic-system-desc">
      <title id="refund-logic-system-title">Refund logic system</title>
      <desc id="refund-logic-system-desc">A customer message enters the version one managed refund agent, which uses hosted code tools backed by policy rules and returns a message with structured tool evidence and a trace.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#df5325"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f9f8f6"/>
      <text x="64" y="60" class="eyebrow">SYSTEM · REFUND LOGIC</text>
      <text x="64" y="112" class="title">The prompt guides; code tools enforce.</text>

      <rect x="312" y="172" width="592" height="292" rx="8" class="zone"/>
      <rect x="336" y="180" width="120" height="16" rx="2" fill="#f9f8f6"/>
      <text x="396" y="192" text-anchor="middle" class="eyebrow">ORQ.AI</text>

      <path d="M272 330 H352" class="arrow"/>
      <path d="M592 330 H672" class="accent-arrow"/>
      <path d="M992 330 H1072" class="arrow"/>
      <path d="M832 378 V488 H472 V378" class="return"/>

      <rect x="238" y="298" width="108" height="16" rx="2" fill="#f9f8f6"/>
      <text x="292" y="310" text-anchor="middle" class="tag">CUSTOMER REQUEST</text>
      <rect x="594" y="298" width="76" height="16" rx="2" fill="#f9f8f6"/>
      <text x="632" y="310" text-anchor="middle" class="tag">TOOL CALL</text>
      <rect x="976" y="298" width="112" height="16" rx="2" fill="#f9f8f6"/>
      <text x="1032" y="310" text-anchor="middle" class="tag">MESSAGE + TRACE</text>
      <rect x="592" y="464" width="120" height="16" rx="2" fill="#f9f8f6"/>
      <text x="652" y="476" text-anchor="middle" class="tag">STRUCTURED RESULT</text>

      <rect x="64" y="282" width="208" height="96" rx="6" fill="#f9f8f6"/>
      <rect x="64" y="282" width="208" height="96" rx="6" class="node"/>
      <rect x="76" y="294" width="44" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/>
      <text x="98" y="304" text-anchor="middle" class="tag">INPUT</text>
      <text x="168" y="335" text-anchor="middle" class="name">Customer message</text>
      <text x="168" y="358" text-anchor="middle" class="sub">refund request</text>

      <rect x="352" y="282" width="240" height="96" rx="6" fill="#f9f8f6"/>
      <rect x="352" y="282" width="240" height="96" rx="6" class="focal"/>
      <rect x="364" y="294" width="50" height="14" rx="2" fill="none" stroke="#df5325" stroke-opacity=".7"/>
      <text x="389" y="304" text-anchor="middle" class="tag">V1</text>
      <text x="472" y="335" text-anchor="middle" class="name">Prompt + model</text>
      <text x="472" y="358" text-anchor="middle" class="sub">guides next action</text>

      <rect x="672" y="282" width="240" height="96" rx="6" fill="#f9f8f6"/>
      <rect x="672" y="282" width="240" height="96" rx="6" class="node"/>
      <rect x="684" y="294" width="56" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/>
      <text x="712" y="304" text-anchor="middle" class="tag">TOOLS</text>
      <text x="792" y="335" text-anchor="middle" class="name">Hosted code tools</text>
      <text x="792" y="358" text-anchor="middle" class="sub">policy + hard rules</text>

      <rect x="1072" y="282" width="144" height="96" rx="6" fill="#f9f8f6"/>
      <rect x="1072" y="282" width="144" height="96" rx="6" class="node"/>
      <rect x="1084" y="294" width="48" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/>
      <text x="1108" y="304" text-anchor="middle" class="tag">OUTPUT</text>
      <text x="1144" y="335" text-anchor="middle" class="name">Response</text>
      <text x="1144" y="358" text-anchor="middle" class="sub">answer + trace</text>

      <text x="640" y="548" text-anchor="middle" class="callout">The model requests an action; the tool result determines what happened.</text>
      <line x1="64" y1="632" x2="1216" y2="632" stroke="rgba(37,35,46,.18)"/>
      <text x="64" y="672" class="legend">READ THE SYSTEM</text>
      <line x1="236" y1="668" x2="270" y2="668" class="arrow"/><text x="284" y="672" class="legend">message flow</text>
      <line x1="474" y1="668" x2="508" y2="668" class="accent-arrow"/><text x="522" y="672" class="legend">enforced action</text>
      <line x1="744" y1="668" x2="778" y2="668" class="return"/><text x="792" y="672" class="legend">result returns to context</text>
    </svg>
  </div>
</body>
</html>
