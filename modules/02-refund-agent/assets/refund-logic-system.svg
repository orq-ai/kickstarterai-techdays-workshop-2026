<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img">
  <title>The v1 system</title>
  <desc>The agent version holds instructions, a model and limits and guides what to do; three hosted code tools enforce the refund rules and return structured results.</desc>
  <style>@import url("../../../scripts/diagram.css");</style>
  <defs><marker id="a" markerWidth="14" markerHeight="12" refX="12" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 14 6 0 12z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="540" fill="#f9f8f6"/>

  <rect x="24" y="24" width="380" height="456" rx="12" class="zone"/>
  <text x="48" y="58" class="zone-title">AGENT v1.0.0 · GUIDES</text>
  <rect x="48" y="80" width="332" height="112" rx="10" class="node"/>
  <text x="214" y="124" text-anchor="middle" class="name">Instructions</text>
  <text x="214" y="158" text-anchor="middle" class="sub">role, tone, which tool to use</text>
  <rect x="48" y="212" width="332" height="112" rx="10" class="node"/>
  <text x="214" y="256" text-anchor="middle" class="name">Model</text>
  <text x="214" y="290" text-anchor="middle" class="sub">chosen in .env</text>
  <rect x="48" y="344" width="332" height="112" rx="10" class="node"/>
  <text x="214" y="388" text-anchor="middle" class="name">Limits</text>
  <text x="214" y="422" text-anchor="middle" class="sub">8 iterations, 120 s per turn</text>

  <rect x="500" y="24" width="476" height="456" rx="12" class="zone"/>
  <text x="524" y="58" class="zone-title">HOSTED CODE TOOLS · ENFORCE</text>
  <rect x="524" y="80" width="428" height="112" rx="10" class="node"/>
  <text x="738" y="120" text-anchor="middle" class="tool">lookup_order</text>
  <text x="738" y="150" text-anchor="middle" class="sub">returns the customer's own order only</text>
  <text x="738" y="174" text-anchor="middle" class="sub">hides owner + notes, flags the window</text>
  <rect x="524" y="212" width="428" height="112" rx="10" class="node"/>
  <text x="738" y="252" text-anchor="middle" class="tool">get_policy</text>
  <text x="738" y="282" text-anchor="middle" class="sub">returns the text of one policy topic</text>
  <text x="738" y="306" text-anchor="middle" class="sub">from the knowledge files</text>
  <rect x="524" y="344" width="428" height="112" rx="10" class="focal"/>
  <text x="738" y="384" text-anchor="middle" class="tool">issue_refund</text>
  <text x="738" y="414" text-anchor="middle" class="sub">checks ownership, duplicates, the EUR 500</text>
  <text x="738" y="438" text-anchor="middle" class="sub">cap and the 30-day window</text>

  <path d="M404 170 H500" class="accent"/><text x="452" y="154" text-anchor="middle" class="lbl">call</text>
  <path d="M500 380 H404" class="accent dash"/><text x="452" y="416" text-anchor="middle" class="lbl">result</text>

  <text x="500" y="518" text-anchor="middle" class="note">The model can ask for an action; the tool result decides what happened.</text>
</svg>
