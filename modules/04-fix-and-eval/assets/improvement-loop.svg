<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-labelledby="improvement-loop-title improvement-loop-desc">
  <title id="improvement-loop-title">Turn evidence into a version you can prove</title>
  <desc id="improvement-loop-desc">Failure evidence informs an instruction edit; publishing creates a new agent version; replay, simulation and the regression eval verify it; a fixed failure becomes a new dataset row and the loop repeats.</desc>
  <style>@import url("../../../scripts/diagram.css");</style>
  <defs><marker id="a" markerWidth="14" markerHeight="12" refX="12" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 14 6 0 12z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="450" fill="#f9f8f6"/>

  <rect x="24" y="30" width="280" height="120" rx="10" class="node"/>
  <text x="164" y="74" text-anchor="middle" class="name">Failure evidence</text>
  <text x="164" y="108" text-anchor="middle" class="sub">simulation transcripts</text>
  <text x="164" y="132" text-anchor="middle" class="sub">and version replays</text>
  <rect x="360" y="30" width="280" height="120" rx="10" class="node"/>
  <text x="500" y="74" text-anchor="middle" class="name">Edit instructions</text>
  <text x="500" y="108" text-anchor="middle" class="sub">one hypothesis</text>
  <text x="500" y="132" text-anchor="middle" class="sub">per change</text>
  <rect x="696" y="30" width="280" height="120" rx="10" class="focal"/>
  <text x="836" y="74" text-anchor="middle" class="name">Publish a version</text>
  <text x="836" y="108" text-anchor="middle" class="sub">major bump,</text>
  <text x="836" y="132" text-anchor="middle" class="sub">v1.0.0 to v2.0.0</text>

  <rect x="696" y="230" width="280" height="120" rx="10" class="node"/>
  <text x="836" y="274" text-anchor="middle" class="name">Verify</text>
  <text x="836" y="308" text-anchor="middle" class="sub">replay, re-simulate,</text>
  <text x="836" y="332" text-anchor="middle" class="sub">run the regression eval</text>
  <rect x="360" y="230" width="280" height="120" rx="10" class="node"/>
  <text x="500" y="274" text-anchor="middle" class="name">New dataset row</text>
  <text x="500" y="308" text-anchor="middle" class="sub">a fixed failure becomes</text>
  <text x="500" y="332" text-anchor="middle" class="sub">a permanent test</text>

  <path d="M304 90 H360" class="arrow"/>
  <path d="M640 90 H696" class="arrow"/>
  <path d="M836 150 V230" class="arrow"/>
  <path d="M696 290 H640" class="arrow"/>
  <path d="M360 290 H172 Q164 290 164 282 V150" class="arrow dash"/>

  <text x="500" y="414" text-anchor="middle" class="note">The control refund must still pass after every prompt change.</text>
</svg>
