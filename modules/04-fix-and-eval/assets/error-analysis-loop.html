<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Error analysis to scorer</title><style>body{margin:0;background:#f9f8f6}.diagram-container{width:100%;max-width:100%;min-width:0;overflow-x:auto}svg{display:block;width:100%;min-width:1280px;background:#f9f8f6}.title{font:600 44px Avio,system-ui,sans-serif;fill:#25232e}.eyebrow{font:500 11px Mono,monospace;letter-spacing:1.3px;fill:#025558}.name{font:600 20px Avio,system-ui,sans-serif;fill:#25232e}.sub{font:14px Mono,monospace;fill:#6b6975}.tag{font:500 11px Mono,monospace;letter-spacing:.6px;fill:#6b6975}.legend{font:500 11px Mono,monospace;letter-spacing:.8px;fill:#6b6975}.callout{font:italic 20px Avio,system-ui,sans-serif;fill:#25232e}.node{fill:#f9f8f6;stroke:#25232e;stroke-width:1.2}.focal{fill:rgba(223,83,37,.08);stroke:#df5325;stroke-width:1.4}.zone{fill:rgba(37,35,46,.02);stroke:rgba(37,35,46,.22);stroke-width:1}.arrow{fill:none;stroke:#025558;stroke-width:1.4;marker-end:url(#arrow)}.accent-arrow{fill:none;stroke:#df5325;stroke-width:1.6;marker-end:url(#arrow-accent)}.link-arrow{fill:none;stroke:#299d8f;stroke-width:1.4;marker-end:url(#arrow-link)}.return{fill:none;stroke:#6b6975;stroke-width:1.1;stroke-dasharray:5,4;marker-end:url(#arrow)}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style></head><body><div class="diagram-container"><svg viewBox="0 0 1280 720" role="img" aria-labelledby="error-analysis-loop-title error-analysis-loop-desc"><title id="error-analysis-loop-title">Error analysis to scorer</title><desc id="error-analysis-loop-desc">Transcript observations are grouped into a failure taxonomy before each mode gets a focused binary scorer.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#025558"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#df5325"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#299d8f"/></marker></defs><rect width="1280" height="720" fill="#f9f8f6"/><text x="64" y="60" class="eyebrow">PROCESS · FIX AND EVAL</text><text x="64" y="112" class="title">Name the failure before you try to measure it.</text><path d="M284 330 H364" class="arrow"/><path d="M604 330 H684" class="accent-arrow"/><path d="M924 330 H1004" class="arrow"/><rect x="292.0" y="298" width="64" height="12" rx="2" fill="#f9f8f6"/><text x="324" y="307" text-anchor="middle" class="tag">OBSERVE</text><rect x="612.0" y="298" width="64" height="12" rx="2" fill="#f9f8f6"/><text x="644" y="307" text-anchor="middle" class="tag">GROUP</text><rect x="932.0" y="298" width="64" height="12" rx="2" fill="#f9f8f6"/><text x="964" y="307" text-anchor="middle" class="tag">MEASURE</text><rect x="64" y="282" width="220" height="96" rx="6" fill="#f9f8f6"/><rect x="64" y="282" width="220" height="96" rx="6" class="node"/><rect x="76" y="294" width="40" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/><text x="96" y="304" text-anchor="middle" class="tag">EVIDENCE</text><text x="174.0" y="335" text-anchor="middle" class="name">Traces</text><text x="174.0" y="358" text-anchor="middle" class="sub">transcripts + tool results</text><rect x="364" y="282" width="240" height="96" rx="6" fill="#f9f8f6"/><rect x="364" y="282" width="240" height="96" rx="6" class="node"/><rect x="376" y="294" width="40" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/><text x="396" y="304" text-anchor="middle" class="tag">ANALYSIS</text><text x="484.0" y="335" text-anchor="middle" class="name">Open coding</text><text x="484.0" y="358" text-anchor="middle" class="sub">one short note each</text><rect x="684" y="282" width="240" height="96" rx="6" fill="#f9f8f6"/><rect x="684" y="282" width="240" height="96" rx="6" class="focal"/><rect x="696" y="294" width="40" height="14" rx="2" fill="none" stroke="#df5325" stroke-opacity=".55"/><text x="716" y="304" text-anchor="middle" class="tag">TAXONOMY</text><text x="804.0" y="335" text-anchor="middle" class="name">Failure taxonomy</text><text x="804.0" y="358" text-anchor="middle" class="sub">2–8 named modes</text><rect x="1004" y="282" width="180" height="96" rx="6" fill="#f9f8f6"/><rect x="1004" y="282" width="180" height="96" rx="6" class="node"/><rect x="1016" y="294" width="40" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/><text x="1036" y="304" text-anchor="middle" class="tag">EVAL</text><text x="1094.0" y="335" text-anchor="middle" class="name">Binary scorer</text><text x="1094.0" y="358" text-anchor="middle" class="sub">one per mode</text><text x="640" y="520" text-anchor="middle" class="callout">A precise failure mode produces a precise evaluator.</text><line x1="64" y1="632" x2="1216" y2="632" stroke="rgba(37,35,46,.18)"/><text x="64" y="672" class="legend">LEGEND</text><rect x="188" y="660" width="16" height="12" rx="2" fill="rgba(223,83,37,.08)"/><text x="216" y="672" class="legend">focal taxonomy</text><line x1="440" y1="668" x2="474" y2="668" class="accent-arrow"/><text x="488" y="672" class="legend">critical handoff</text></svg></div></body></html>
