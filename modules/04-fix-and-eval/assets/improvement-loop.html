<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Prompt improvement feedback loop</title><style>body{margin:0;background:#f9f8f6}.diagram-container{width:100%;max-width:100%;min-width:0;overflow-x:auto}svg{display:block;width:100%;min-width:1280px;background:#f9f8f6}.title{font:600 44px Avio,system-ui,sans-serif;fill:#25232e}.eyebrow{font:500 11px Mono,monospace;letter-spacing:1.3px;fill:#025558}.name{font:600 20px Avio,system-ui,sans-serif;fill:#25232e}.sub{font:14px Mono,monospace;fill:#6b6975}.tag{font:500 11px Mono,monospace;letter-spacing:.6px;fill:#6b6975}.legend{font:500 11px Mono,monospace;letter-spacing:.8px;fill:#6b6975}.callout{font:italic 20px Avio,system-ui,sans-serif;fill:#25232e}.node{fill:#f9f8f6;stroke:#25232e;stroke-width:1.2}.focal{fill:rgba(223,83,37,.08);stroke:#df5325;stroke-width:1.4}.zone{fill:rgba(37,35,46,.02);stroke:rgba(37,35,46,.22);stroke-width:1}.arrow{fill:none;stroke:#025558;stroke-width:1.4;marker-end:url(#arrow)}.accent-arrow{fill:none;stroke:#df5325;stroke-width:1.6;marker-end:url(#arrow-accent)}.link-arrow{fill:none;stroke:#299d8f;stroke-width:1.4;marker-end:url(#arrow-link)}.return{fill:none;stroke:#6b6975;stroke-width:1.1;stroke-dasharray:5,4;marker-end:url(#arrow)}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style></head><body><div class="diagram-container"><svg viewBox="0 0 1280 720" role="img" aria-labelledby="improvement-loop-title improvement-loop-desc"><title id="improvement-loop-title">Prompt improvement feedback loop</title><desc id="improvement-loop-desc">Failure evidence changes instructions, creates a new version, and returns verified results to the regression suite.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#025558"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#df5325"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#299d8f"/></marker></defs><rect width="1280" height="720" fill="#f9f8f6"/><text x="64" y="60" class="eyebrow">PROCESS · FIX AND EVAL</text><text x="64" y="112" class="title">Turn evidence into a version you can prove.</text><path d="M274 330 H354" class="arrow"/><path d="M594 330 H674" class="accent-arrow"/><path d="M914 330 H994" class="arrow"/><rect x="282.0" y="298" width="64" height="12" rx="2" fill="#f9f8f6"/><text x="314" y="307" text-anchor="middle" class="tag">EDIT</text><rect x="602.0" y="298" width="64" height="12" rx="2" fill="#f9f8f6"/><text x="634" y="307" text-anchor="middle" class="tag">PUBLISH</text><rect x="922.0" y="298" width="64" height="12" rx="2" fill="#f9f8f6"/><text x="954" y="307" text-anchor="middle" class="tag">VERIFY</text><path d="M1089 416 V492 H169 V416" class="return"/><rect x="534.75" y="468" width="188.5" height="12" rx="2" fill="#f9f8f6"/><text x="629" y="477" text-anchor="middle" class="tag">FAILURE BECOMES A DATASET ROW</text><rect x="64" y="282" width="210" height="96" rx="6" fill="#f9f8f6"/><rect x="64" y="282" width="210" height="96" rx="6" class="node"/><rect x="76" y="294" width="40" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/><text x="96" y="304" text-anchor="middle" class="tag">EVIDENCE</text><text x="169.0" y="335" text-anchor="middle" class="name">Failure evidence</text><text x="169.0" y="358" text-anchor="middle" class="sub">simulation + replay</text><rect x="354" y="282" width="240" height="96" rx="6" fill="#f9f8f6"/><rect x="354" y="282" width="240" height="96" rx="6" class="node"/><rect x="366" y="294" width="40" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/><text x="386" y="304" text-anchor="middle" class="tag">PROMPT</text><text x="474.0" y="335" text-anchor="middle" class="name">Instructions</text><text x="474.0" y="358" text-anchor="middle" class="sub">prompt hypothesis</text><rect x="674" y="282" width="240" height="96" rx="6" fill="#f9f8f6"/><rect x="674" y="282" width="240" height="96" rx="6" class="focal"/><rect x="686" y="294" width="40" height="14" rx="2" fill="none" stroke="#df5325" stroke-opacity=".55"/><text x="706" y="304" text-anchor="middle" class="tag">VERSION</text><text x="794.0" y="335" text-anchor="middle" class="name">Agent version</text><text x="794.0" y="358" text-anchor="middle" class="sub">publish a major version</text><rect x="994" y="282" width="190" height="96" rx="6" fill="#f9f8f6"/><rect x="994" y="282" width="190" height="96" rx="6" class="node"/><rect x="1006" y="294" width="40" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/><text x="1026" y="304" text-anchor="middle" class="tag">PROOF</text><text x="1089.0" y="335" text-anchor="middle" class="name">Evaluation</text><text x="1089.0" y="358" text-anchor="middle" class="sub">simulation + gate</text><text x="640" y="552" text-anchor="middle" class="callout">The control refund must still work after every prompt change.</text><line x1="64" y1="632" x2="1216" y2="632" stroke="rgba(37,35,46,.18)"/><text x="64" y="672" class="legend">LEGEND</text><line x1="190" y1="668" x2="224" y2="668" class="accent-arrow"/><text x="238" y="672" class="legend">versioned change</text><line x1="468" y1="668" x2="502" y2="668" class="return"/><text x="516" y="672" class="legend">learning loop</text></svg></div></body></html>
