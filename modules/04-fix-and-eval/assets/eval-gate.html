<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Regression evaluation gate</title><style>body{margin:0;background:#f9f8f6}.diagram-container{width:100%;max-width:100%;min-width:0;overflow-x:auto}svg{display:block;width:100%;min-width:1280px;background:#f9f8f6}.title{font:600 44px Avio,system-ui,sans-serif;fill:#25232e}.eyebrow{font:500 11px Mono,monospace;letter-spacing:1.3px;fill:#025558}.name{font:600 20px Avio,system-ui,sans-serif;fill:#25232e}.sub{font:14px Mono,monospace;fill:#6b6975}.tag{font:500 11px Mono,monospace;letter-spacing:.6px;fill:#6b6975}.legend{font:500 11px Mono,monospace;letter-spacing:.8px;fill:#6b6975}.callout{font:italic 20px Avio,system-ui,sans-serif;fill:#25232e}.node{fill:#f9f8f6;stroke:#25232e;stroke-width:1.2}.focal{fill:rgba(223,83,37,.08);stroke:#df5325;stroke-width:1.4}.zone{fill:rgba(37,35,46,.02);stroke:rgba(37,35,46,.22);stroke-width:1}.arrow{fill:none;stroke:#025558;stroke-width:1.4;marker-end:url(#arrow)}.accent-arrow{fill:none;stroke:#df5325;stroke-width:1.6;marker-end:url(#arrow-accent)}.link-arrow{fill:none;stroke:#299d8f;stroke-width:1.4;marker-end:url(#arrow-link)}.return{fill:none;stroke:#6b6975;stroke-width:1.1;stroke-dasharray:5,4;marker-end:url(#arrow)}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style></head><body><div class="diagram-container"><svg viewBox="0 0 1280 720" role="img" aria-labelledby="eval-gate-title eval-gate-desc"><title id="eval-gate-title">Regression evaluation gate</title><desc id="eval-gate-desc">Fixed dataset rows run through a pinned agent version, scorer means meet thresholds, and the result is recorded as an Experiment.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#025558"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#df5325"/></marker><marker id="arrow-link" markerWidth="8" mar
