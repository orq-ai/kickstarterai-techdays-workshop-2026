="auto"><polygon points="0 0,8 3,0 6" fill="#299d8f"/></marker></defs><rect width="1280" height="720" fill="#f9f8f6"/><text x="64" y="60" class="eyebrow">DATA FLOW · SIMULATION</text><text x="64" y="112" class="title">Coverage comes from persona times scenario.</text><rect x="80" y="190" width="264" height="230" rx="8" class="zone"/><rect x="508" y="190" width="264" height="230" rx="8" class="zone"/><path d="M344 304 H508" class="accent-arrow"/><path d="M772 304 H936" class="arrow"/><rect x="394.0" y="272" width="64" height="12" rx="2" fill="#f9f8f6"/><text x="426" y="281" text-anchor="middle" class="tag">COMBINE</text><rect x="811.75" y="272" width="84.5" height="12" rx="2" fill="#f9f8f6"/><text x="854" y="281" text-anchor="middle" class="tag">RUN SIX CASES</text><rect x="104" y="242" width="216" height="96" rx="6" fill="#f9f8f6"/><rect x="104" y="242" width="216" height="96" rx="6" class="node"/><rect x="116" y="254" width="40" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/><text x="136" y="264" text-anchor="middle" class="tag">INPUT</text><text x="212.0" y="295" text-anchor="middle" class="name">2 personas</text><text x="212.0" y="318" text-anchor="middle" class="sub">polite · assertive</text><rect x="532" y="242" width="216" height="96" rx="6" fill="#f9f8f6"/><rect x="532" y="242" width="216" height="96" rx="6" class="node"/><rect x="544" y="254" width="40" height="14" rx="2" fill="none" stroke="#025558" stroke-opacity=".55"/><text x="564" y="264" text-anchor="middle" class="tag">INPUT</text><text x="640.0" y="295" text-anchor="middle" class="name">3 scenarios</text><text x="640.0" y="318" text-anchor="middle" class="sub">ordinary · edge · update</text><rect x="936" y="256" width="240" height="96" rx="6" fill="#f9f8f6"/><rect x="936" y="256" width="240" height="96" rx="6" class="focal"/><rect x="948" y="268" width="40" height="14" rx="2" fill="none" stroke="#df5325" stroke-opacity=".55"/><text x="968" y="278" text-anchor="middle" class="ta
