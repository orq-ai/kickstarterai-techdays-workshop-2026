[project]
name = "kickstarterai-techdays-workshop"
version = "0.1.0"
description = "KickstartAI TechDays 2026: test a managed orq.ai agent with simulation, a fix, and a regression eval."
requires-python = ">=3.11,<3.14"
dependencies = [
    "orq-ai-sdk>=4.16.8,<5",
    "openai>=1.60",
    "evaluatorq[dashboard,insights,redteam]>=1.73.1",
    "python-dotenv>=1.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "termynal>=0.12",
    "mkdocs-glightbox>=0.4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
