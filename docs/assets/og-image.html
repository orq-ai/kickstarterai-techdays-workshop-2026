<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KickstartAI TechDays 2026</title>
  <style>
    @font-face { font-family: Avio; src: url("../stylesheets/fonts/AvioSans-Regular.woff2"); }
    @font-face { font-family: Avio; src: url("../stylesheets/fonts/AvioSans-SemiBold.woff2"); font-weight: 600; }
    @font-face { font-family: Kurrent; src: url("../stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2"); font-weight: 600; }
    @font-face { font-family: Mono; src: url("../stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2"); }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f9f8f6; }
    svg { display: block; width: 1200px; height: 630px; }
    .eyebrow { font: 14px Mono, monospace; letter-spacing: 2px; fill: #025558; }
    .title { font: 600 58px Kurrent, serif; fill: #25232e; }
    .subtitle { font: 24px Avio, sans-serif; fill: #6b6975; }
    .node-name { font: 600 22px Avio, sans-serif; fill: #25232e; }
    .node-sub { font: 14px Mono, monospace; fill: #6b6975; }
    .tag { font: 12px Mono, monospace; letter-spacing: 1px; fill: #025558; }
    .footer { font: 600 20px Avio, sans-serif; fill: #25232e; }
    .node { fill: #f9f8f6; stroke: #025558; stroke-width: 2; }
    .focal { fill: rgba(223,83,37,.08); stroke: #df5325; stroke-width: 2.5; }
    .arrow { fill: none; stroke: #299d8f; stroke-width: 3; marker-end: url(#arrow); }
    .accent-arrow { fill: none; stroke: #df5325; stroke-width: 3.5; marker-end: url(#accent-arrow); }
  </style>
</head>
<body>
  <svg viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
    <title id="title">KickstartAI TechDays 2026 workshop</title>
    <desc id="desc">A workshop card showing the path from building a managed agent through simulation and a fix to proof with an evaluation gate.</desc>
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0 0 L12 4 L0 8z" fill="#299d8f"/></marker>
      <marker id="accent-arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0 0 L12 4 L0 8z" fill="#df5325"/></marker>
    </defs>
    <rect width="1200" height="630" fill="#f9f8f6"/>
    <rect x="0" y="0" width="1200" height="12" fill="#025558"/>
    <text x="76" y="82" class="eyebrow">KICKSTARTAI TECHDAYS · 2026</text>
    <text x="76" y="158" class="title">Build, simulate, fix, and prove</text>
    <text x="76" y="218" class="title">a managed agent.</text>
    <text x="76" y="268" class="subtitle">A two-hour hands-on workshop with orq.ai</text>

    <path d="M280 438 H365" class="arrow"/>
    <path d="M555 438 H640" class="arrow"/>
    <path d="M830 438 H915" class="accent-arrow"/>

    <rect x="80" y="375" width="200" height="126" rx="8" class="node"/>
    <text x="100" y="404" class="tag">01 · BUILD</text>
    <text x="180" y="446" text-anchor="middle" class="node-name">Managed agent</text>
    <text x="180" y="473" text-anchor="middle" class="node-sub">tools · versions</text>

    <rect x="355" y="375" width="200" height="126" rx="8" class="node"/>
    <text x="375" y="404" class="tag">02 · SIMULATE</text>
    <text x="455" y="446" text-anchor="middle" class="node-name">Customers</text>
    <text x="455" y="473" text-anchor="middle" class="node-sub">evidence · traces</text>

    <rect x="630" y="375" width="200" height="126" rx="8" class="node"/>
    <text x="650" y="404" class="tag">03 · FIX</text>
    <text x="730" y="446" text-anchor="middle" class="node-name">Instructions</text>
    <text x="730" y="473" text-anchor="middle" class="node-sub">new agent version</text>

    <rect x="905" y="375" width="215" height="126" rx="8" class="focal"/>
    <text x="925" y="404" class="tag">04 · PROVE</text>
    <text x="1012" y="446" text-anchor="middle" class="node-name">Evaluation gate</text>
    <text x="1012" y="473" text-anchor="middle" class="node-sub">dataset · scorers</text>

    <line x1="76" y1="556" x2="1124" y2="556" stroke="rgba(37,35,46,.18)" stroke-width="1"/>
    <text x="76" y="594" class="footer">orq.ai</text>
    <text x="180" y="594" class="node-sub">AI GATEWAY · MANAGED AGENTS · EVALUATIONS</text>
  </svg>
</body>
</html>
