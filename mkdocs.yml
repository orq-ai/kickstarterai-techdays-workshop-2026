site_name: KickstartAI TechDays · orq.ai
site_description: Build, simulate, improve, and evaluate a managed orq.ai refund agent.
site_url: https://orq-ai.github.io/kickstarterai-techdays-workshop-2026/
repo_url: https://github.com/orq-ai/kickstarterai-techdays-workshop-2026
repo_name: orq-ai/kickstarterai-techdays-workshop-2026
docs_dir: docs

# `mkdocs serve` watches docs_dir, the config and the hooks. Module lessons are
# snippet-included from modules/, so without this an edit there shows nothing until restart.
watch:
  - modules
copyright: "© 2026 Orq AI · MIT License"

theme:
  name: material
  custom_dir: overrides
  logo: assets/orq-mark-white.svg
  favicon: assets/orq-favicon.svg
  font: false
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Switch dark mode }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Switch light mode }

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - js/keyboard.js
hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - glightbox:
      touchNavigation: true
      zoomable: true
      skip_classes:
        - md-logo
  - termynal:
      prompt_literal_start:
        - "$"
        - ">>>"

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - abbr
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Onboarding:
      - Workspace Setup: modules/00.md
      - Coding Agent Setup (optional): modules/01.md
  - Build a Managed Agent:
      - Foundations: modules/02-concepts.md
      - Use Case: modules/02-logic.md
      - Agent Design: modules/02-solution-design.md
      - Build the Agent: modules/02.md
  - Agent Simulation:
      - Concepts: modules/03-concepts.md
      - Tutorial: modules/03.md
  - Improve and Evaluate:
      - Concepts: modules/04-concepts.md
      - Tutorial: modules/04.md
  - Reference:
      - Cheat sheet: reference/cheat-sheet.md
      - Troubleshooting: reference/troubleshooting.md
      - Glossary: reference/glossary.md
